default_command_elevation = "intercept"

[ignore]
gitignore = ["push", "pull"]
patterns = [
    "*.archived",
    "*.bak",
    "__pycache__/",
    ".DS_Store",
    ".codex",
    "node_modules/",
    ".venv/",
    "*.dotdropbak",
]
skip_markers = [".dotman-skip"]

[hooks]
guard_push = [
    'sh "$DOTMAN_REPO_ROOT/scripts/check_core_env.sh"',
]
