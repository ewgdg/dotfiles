id = "t3code"
description = "T3 Code desktop app for driving local coding agents"

[vars.t3code]
# Onboarding completion and dismissed update notices are per-machine state,
# not preferences.
client_settings_selectors = ["onboardingCompletedAt", "dismissedProviderUpdateNotificationKeys"]
# The legacy-migration marker, per-project overrides keyed by locally generated
# project ids, and device onboarding/hosts are per-machine state.
server_settings_selectors = [
  "projectSettingsFolded",
  "projectSettingsOverrides",
  "projectScriptOverrides",
  "projectAutoPullOverrides",
  "projectAgentBrowserAccessOverrides",
  "deviceOnboardingCompleted",
  "deviceHosts",
]

[targets.t3code_install]
sync_policy = "push-only"
# On Linux only the AppImage (or .deb) updates itself, with delta downloads;
# the AUR build unpacks it into /opt, which disables the in-app updater. So we
# install it once and the app replaces the file in place from then on.
# Homebrew ships the desktop app as the `t3-code` cask.
# The app writes its own hidden `com.t3tools.T3Code.desktop` URL handler on
# every launch, so the menu entry drops its MimeType to avoid a duplicate.
probe = '{% if os == "linux" %}{{ PROBE_APPIMAGE_INSTALLED }} --name t3code --link-command{% elif os == "darwin" %}{{ PROBE_PACKAGES_INSTALLED }} t3-code{% endif %}'

[targets.t3code_install.hooks]
pre_push = '{% if os == "linux" %}url=$(sh "$DOTMAN_PACKAGE_ROOT/scripts/latest_appimage_url.sh" {{ cpu_arch }}) && {{ APPIMAGE_INSTALL }} --name t3code --url "$url" --link-command --drop-mime-types{% elif os == "darwin" %}{{ INSTALL }} t3-code{% endif %}'

# Sources start absent until the app writes them and `dotman pull` captures
# them; `type` is required while both repo and live files are missing.
[targets.f_t3_userdata_settings_json]
source = "files/t3/userdata/settings.json"
path = "~/.t3/userdata/settings.json"
type = "file"
render = '{{ JSON_RENDER }} --selector-type retain --selectors {{ vars.t3code.server_settings_selectors|shell_args }}'
capture = '{{ JSON_CAPTURE }} --selector-type remove --selectors {{ vars.t3code.server_settings_selectors|shell_args }}'

[targets.f_t3_userdata_client_settings_json]
source = "files/t3/userdata/client-settings.json"
path = "~/.t3/userdata/client-settings.json"
type = "file"
render = '{{ JSON_RENDER }} --selector-type retain --selectors {{ vars.t3code.client_settings_selectors|shell_args }}'
capture = '{{ JSON_CAPTURE }} --selector-type remove --selectors {{ vars.t3code.client_settings_selectors|shell_args }}'

[targets.f_t3_userdata_keybindings_json]
source = "files/t3/userdata/keybindings.json"
path = "~/.t3/userdata/keybindings.json"
type = "file"
