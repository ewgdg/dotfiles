id = "pi-coding-agent"

depends = [
  "agents",
  "nodejs",
]

[vars.pi_coding_agent]
# Volatile runtime preferences stay live-local so repo pushes do not force stale
# provider/model/thinking choices or re-run old changelog/update handling.
settings_selectors = [
  "defaultProvider",
  "defaultModel",
  "lastChangelogVersion",
  "defaultThinkingLevel",
  "hideThinkingBlock",
]

[targets.d_pi_agent]
source = "files/pi/agent"
path = "~/.pi/agent"

[targets.d_pi_agent.ignore]
patterns = [
  # Runtime state and caches stay local; everything else under ~/.pi/agent is config worth backing up.
  "auth.json",
  "*-accounts.json",
  "crashes.json",
  "git/",
  "npm/",
  "run-history.jsonl",
  "sessions/",
  "trust.json",
  "models-store.json",
  # Managed independently as a symlink to the shared global instructions.
  "AGENTS.md",
  # prefer ~/.agents/skills
  "skills/",
  "state/",
  "cache/",
  # Built-in MCP OAuth tokens and server log.
  "mcp-auth.json",
  "mcp.log*",
  "*changelog.json",
  "pi-durable-subagents.json",
  # pi.dev installer-managed releases and launcher; `pi update` owns them.
  "install/",
  "bin/",
]

[targets.d_pi_agent.path_rules.settings_json]
pattern = "settings.json"
render = '{{ JSON_RENDER }} --selector-type retain --selectors {{ vars.pi_coding_agent.settings_selectors|shell_args }}'
capture = '{{ JSON_CAPTURE }} --selector-type remove --selectors {{ vars.pi_coding_agent.settings_selectors|shell_args }}'

[targets.pi_global_instructions]
sync_policy = "push-only"
probe = 'sh "$DOTMAN_REPO_ROOT/scripts/manage_relative_symlink.sh" probe "~/.pi/agent/AGENTS.md" "~/.agents/AGENTS.md"'

[targets.pi_global_instructions.hooks]
pre_push = 'sh "$DOTMAN_REPO_ROOT/scripts/manage_relative_symlink.sh" apply "~/.pi/agent/AGENTS.md" "~/.agents/AGENTS.md"'

[targets.pi_coding_agent_install]
sync_policy = "push-only"
probe = '{{ PROBE_COMMANDS_ON_PATH }} pi'

[targets.pi_coding_agent_install.hooks]
# The pi.dev installer pins transitive dependencies; the npm package no longer does.
# It links pi into the first known bin dir on PATH and has no override. Put
# ~/.local/bin first so it skips ~/bin, which the bin package mirrors and would
# prune the link from.
pre_push = 'curl -fsSL https://pi.dev/install.sh | PATH="$HOME/.local/bin:$PATH" sh'
