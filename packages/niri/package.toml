id = "niri"
description = "Niri compositor configuration"

depends = [
  "niri-custom-git",
  "noctalia",
]

[targets.d_config_niri]
source = "files/config/niri"
path = "~/.config/niri"

[[targets.d_config_niri.path_rules]]
pattern = "cfg/debug.kdl"
preset = "jinja-patch"

[targets.f_config_systemd_user_niri_shell_service]
source = "files/config/systemd/user/niri-shell.service"
path = "~/.config/systemd/user/niri-shell.service"

[targets.f_config_systemd_user_niri_service_d_override_conf]
source = "files/config/systemd/user/niri.service.d/override.conf"
path = "~/.config/systemd/user/niri.service.d/override.conf"
preset = "jinja-patch-editor"

[targets.f_config_systemd_user_niri_event_stream_rules_service]
source = "files/config/systemd/user/niri-event-stream-rules.service"
path = "~/.config/systemd/user/niri-event-stream-rules.service"

[targets.f_config_xdg_desktop_portal_niri_portals_conf]
source = "files/config/xdg-desktop-portal/niri-portals.conf"
path = "~/.config/xdg-desktop-portal/niri-portals.conf"

# This NVIDIA override only matters for the Niri session in this repo, so keep ownership here.
[targets.f_etc_nvidia_nvidia_application_profiles_rc_d_50_limit_free_buffer_pool_in_wayland_compositors_json]
source = "files/etc/nvidia/nvidia-application-profiles-rc.d/50-limit-free-buffer-pool-in-wayland-compositors.json"
path = "/etc/nvidia/nvidia-application-profiles-rc.d/50-limit-free-buffer-pool-in-wayland-compositors.json"
#sync_policy = "push-only-delete"

# Niri session expects these desktop apps/themes via keybinds, mime defaults, and GTK/icon settings.
# One probe target per related group; probes are variadic, so a group is a single probe + install.
[targets.session_dependencies_installed]
sync_policy = "push-only"
probe = "{{ PROBE_PACKAGES_INSTALLED }} xwayland-satellite xdg-desktop-portal-gnome jq"

[targets.session_dependencies_installed.hooks]
pre_push = "{{ INSTALL }} xwayland-satellite xdg-desktop-portal-gnome jq"

[targets.desktop_apps_installed]
sync_policy = "push-only"
probe = "{{ PROBE_PACKAGES_INSTALLED }} nautilus imv loupe papers gnome-text-editor file-roller"

[targets.desktop_apps_installed.hooks]
pre_push = "{{ INSTALL }} nautilus imv loupe papers gnome-text-editor file-roller"

[targets.desktop_themes_installed]
sync_policy = "push-only"
probe = "{{ PROBE_PACKAGES_INSTALLED }} bibata-cursor-theme-bin papirus-icon-theme adw-gtk-theme nwg-look"

[targets.desktop_themes_installed.hooks]
pre_push = "{{ INSTALL }} bibata-cursor-theme-bin papirus-icon-theme adw-gtk-theme nwg-look"

[targets.nautilus_support_installed]
sync_policy = "push-only"
probe = "{{ PROBE_PACKAGES_INSTALLED }} ffmpegthumbnailer gvfs-smb gvfs-wsdd gvfs-dnssd"

[targets.nautilus_support_installed.hooks]
pre_push = "{{ INSTALL }} ffmpegthumbnailer gvfs-smb gvfs-wsdd gvfs-dnssd"

[hooks]
post_push = [
  '{{ ENSURE_SYSTEMD }} user niri-shell.service',
  '{{ ENSURE_SYSTEMD }} user niri-event-stream-rules.service',
]
