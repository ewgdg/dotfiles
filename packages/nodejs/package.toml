id = "nodejs"
description = "Node.js user configuration and toolchain bootstrap"

[targets.f_npmrc]
source = "files/npmrc"
path = "~/.npmrc"
chmod = "600"

[targets.nodejs_toolchain_installed]
sync_policy = "push-only"
probe = "{{ PROBE_PACKAGES_INSTALLED }} {{ NODEJS_INSTALL_PACKAGES }} bun fnm"

[targets.nodejs_toolchain_installed.hooks]
# Package-manager names differ across OS profiles (`nodejs` on Arch, `node` on Homebrew).
pre_push = [
  "{{ INSTALL }} {{ NODEJS_INSTALL_PACKAGES }}",
  "{{ INSTALL }} bun fnm",
]

# The devspace service runs under `fnm exec --using=default`, so this probes that
# exact capability instead of fnm's on-disk layout; any failure means action is
# needed. Installing the fnm binary does not install a node version or an alias.
[targets.fnm_default_node_installed]
sync_policy = "push-only"
probe = 'fnm exec --using=default -- node --version >/dev/null 2>&1 && exit 100; exit 0'

[targets.fnm_default_node_installed.hooks]
# fnm install has no --default flag, and ls-remote appends the codename, for
# example "v24.21.0 (Krypton)".
pre_push = 'version="$(fnm ls-remote --lts --latest | cut -d" " -f1)" && fnm install "$version" && fnm default "$version"'
