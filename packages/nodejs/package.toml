id = "nodejs"
description = "Node.js user configuration and toolchain bootstrap"

[targets.f_npmrc]
source = "files/npmrc"
path = "~/.npmrc"
chmod = "600"

[targets.nodejs_toolchain_installed]
sync_policy = "push-only"
probe = "{{ PROBE_PACKAGES_INSTALLED }} {{ NODEJS_INSTALL_PACKAGES }} bun fnm"

[targets.nodejs_toolchain_installed.hooks]
# Package-manager names differ across OS profiles (`nodejs` on Arch, `node` on Homebrew).
pre_push = [
  "{{ INSTALL }} {{ NODEJS_INSTALL_PACKAGES }}",
  "{{ INSTALL }} bun fnm",
]

# fnm's default node tracks the current LTS: it is the runtime for interactive
# shells, global CLIs, and the devspace service, so it is the one place node is
# chosen. The script also rebuilds global native modules when crossing a node
# major, which would otherwise invalidate every installed native binding.
[targets.fnm_default_node_on_lts]
sync_policy = "push-only"
probe = 'sh "$DOTMAN_PACKAGE_ROOT/scripts/fnm_default_lts.sh" probe'

[targets.fnm_default_node_on_lts.hooks]
pre_push = 'sh "$DOTMAN_PACKAGE_ROOT/scripts/fnm_default_lts.sh" apply'
