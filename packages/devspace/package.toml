id = "devspace"
description = "DevSpace MCP coding harness for ChatGPT"

depends = [
  "agents",
  "nodejs",
]

# DevSpace starts local-only: an empty origin renders the config key as null and
# the server keeps serving 127.0.0.1:7676. Set a tunnel origin here to expose it,
# or override per host in ~/.config/dotman/repos/<repo>/local.toml.
[vars.devspace]
public_base_url = ""

[targets.devspace_install]
sync_policy = "push-only"
probe = 'npm_prefix=$(npm prefix --global) || exit 1; if [ -x "$npm_prefix/bin/devspace" ] && "$npm_prefix/bin/devspace" version >/dev/null 2>&1; then exit 100; fi; exit 0'

[targets.devspace_install.hooks]
pre_push = "{{ NPM_INSTALL }} @waishnav/devspace"

[targets.devspace_owner_token]
sync_policy = "push-only"
probe = 'sh "$DOTMAN_PACKAGE_ROOT/scripts/mint_owner_token.sh" probe'

[targets.devspace_owner_token.hooks]
pre_push = 'sh "$DOTMAN_PACKAGE_ROOT/scripts/mint_owner_token.sh" apply'

# The source is a Jinja template because config.jsonc carries comments and
# dotman transform json rejects JSONC, so no selector transform can render it.
[targets.f_devspace_config]
source = "files/devspace/config.jsonc"
path = "~/.devspace/config.jsonc"
chmod = "600"
preset = "jinja-patch-editor"
