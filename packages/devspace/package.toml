id = "devspace"
description = "DevSpace MCP coding harness for ChatGPT"

depends = [
  "agents",
  "nodejs",
]

# DevSpace runs on one host, so the tunnel origin is committed. An empty value
# renders the config key as null, which is DevSpace's local-only mode; a second
# host overrides the var in ~/.config/dotman/repos/<repo>/local.toml.
[vars.devspace]
public_base_url = "https://devspace.xianzzz.com"

[targets.devspace_install]
sync_policy = "push-only"
probe = 'npm_prefix=$(npm prefix --global) || exit 1; if [ -x "$npm_prefix/bin/devspace" ] && "$npm_prefix/bin/devspace" version >/dev/null 2>&1; then exit 100; fi; exit 0'

[targets.devspace_install.hooks]
pre_push = "{{ NPM_INSTALL }} @waishnav/devspace"

[targets.devspace_owner_token]
sync_policy = "push-only"
probe = 'sh "$DOTMAN_PACKAGE_ROOT/scripts/mint_owner_token.sh" probe'

[targets.devspace_owner_token.hooks]
pre_push = 'sh "$DOTMAN_PACKAGE_ROOT/scripts/mint_owner_token.sh" apply'

# The source is a Jinja template because publicBaseUrl is conditional: an empty
# [vars.devspace] public_base_url has to render null rather than "", and no
# selector transform can express that.
#
# config.json, not config.jsonc: the released 1.0.8 reads config.json with
# JSON.parse, so comments would leave the service unconfigured. main reads
# config.jsonc and migrates the old file on upgrade.
[targets.f_devspace_config]
source = "files/devspace/config.json"
path = "~/.devspace/config.json"
chmod = "600"
preset = "jinja-patch-editor"
