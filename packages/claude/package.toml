id = "claude"
depends = ["agents"]

[vars.claude]
# Interactive model and effort choices are live-local preferences.
settings_selectors = ["model", "effortLevel"]

[targets.claude_global_instructions]
sync_policy = "push-only"
probe = 'sh "$DOTMAN_REPO_ROOT/scripts/manage_relative_symlink.sh" probe "~/.claude/rules/global.md" "~/.agents/AGENTS.md"'

[targets.claude_global_instructions.hooks]
pre_push = 'sh "$DOTMAN_REPO_ROOT/scripts/manage_relative_symlink.sh" apply "~/.claude/rules/global.md" "~/.agents/AGENTS.md"'

# Global CLAUDE.md stays tracked but empty. Shared global instructions live in
# ~/.claude/rules/global.md (symlinked to ~/.agents/AGENTS.md).
[targets.f_claude_global_md]
source = "files/claude/CLAUDE.md"
path = "~/.claude/CLAUDE.md"

[targets.f_claude_settings_json]
source = "files/claude/settings.json"
path = "~/.claude/settings.json"
chmod = "600"
render = '{{ JSON_RENDER_HOME_PATHS }} --selector-type retain --selectors {{ vars.claude.settings_selectors|shell_args }}'
capture = '{{ JSON_CAPTURE_HOME_PATHS }} --selector-type remove --selectors {{ vars.claude.settings_selectors|shell_args }}'

[targets.f_claude_statusline_js]
source = "files/claude/statusline.js"
path = "~/.claude/statusline.js"
chmod = "755"

[targets.f_claude_subagent_statusline_js]
source = "files/claude/subagent-statusline.js"
path = "~/.claude/subagent-statusline.js"
chmod = "755"

[targets.d_claude_hooks]
source = "files/claude/hooks"
path = "~/.claude/hooks"

# Claude Code reads skills from ~/.claude/skills; share the agent-neutral set.
[targets.claude_skills_link]
sync_policy = "push-only"
probe = 'sh "$DOTMAN_REPO_ROOT/scripts/manage_relative_symlink.sh" probe "~/.claude/skills" "~/.agents/skills"'

[targets.claude_skills_link.hooks]
pre_push = 'sh "$DOTMAN_REPO_ROOT/scripts/manage_relative_symlink.sh" apply "~/.claude/skills" "~/.agents/skills"'
