id = "nvim"
description = "Neovim configuration"

[targets.d_config_nvim]
source = "files/config/nvim"
path = "~/.config/nvim"

[targets.d_config_nvim.ignore]
patterns = [
  "*lock.json",
  ".nvimlog",
]

[targets.f_config_topgrade_d_mason_toml]
source = "files/config/topgrade.d/mason.toml"
path = "~/.config/topgrade.d/mason.toml"

[hooks]
pre_push = [
  "{{ INSTALL }} neovim",
]
