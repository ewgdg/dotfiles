onboarding = false

[keys]
# Keep scrollback editing available when the Neovim sidebar takes prefix+e.
edit_scrollback = "prefix+shift+e"
switch_workspace = "ctrl+1..9"
previous_workspace = "ctrl+shift+k"
next_workspace = "ctrl+shift+j"
previous_agent = "ctrl+shift+h"
next_agent = "ctrl+shift+l"

[[keys.command]]
key = "prefix+\\"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Toggle reviewr"

[theme]
name = "gruvbox"
auto_switch = false

[theme.custom]
surface_dim = "#504945"

[ui]
show_agent_labels_on_pane_borders = false
mouse_scroll_lines = 1
#copy_on_select = false

status_indicators = "symbols"
[experimental]
pane_history = true
kitty_graphics = true

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[update]
channel = "stable"

# Added by `herdr-nvim setup-keys`.
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "herdr-nvim.toggle"
description = "toggle Neovim sidebar"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-nvim.pick-file"
description = "open file from agent output"
