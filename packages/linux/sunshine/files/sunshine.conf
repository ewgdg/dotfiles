{% set session = vars.desktop.session -%}
{# Niri and Hyprland both keep a fixed `sunshine` headless output for WLR capture. #}
{% set headless_capture = session in ["niri", "hyprland"] -%}
{% set capture_backend = "wlr" if headless_capture else "kms" -%}
{% set prep_args = "--scale dpi-auto" -%}
{% set undo_args = "" -%}
{# Keep physical outputs enabled with headless capture so Wine/Xwayland windows do
   not see monitor hotplug on every stream transition. Other sessions retain solo mode. #}
{% if not headless_capture -%}
{% set prep_args = "--solo " ~ prep_args -%}
{% endif -%}
{# KMS capture can spam DPMS errors if outputs idle mid-stream. WLR headless
   capture does not need default idle inhibition; keep it opt-in. #}
{% if capture_backend == "kms" -%}
{% set prep_args = prep_args ~ " --inhibit" -%}
{% endif -%}
{% if headless_capture -%}
{% set prep_args = prep_args ~ " --headless" -%}
{% set undo_args = "--dormant-headless" -%}
{% endif -%}
{# Capture buffers (`adapter_name`) and the encoder must sit on the GPU the compositor
   renders on; `vars.render_gpu` comes from scripts/select_render_gpu.py at render time.
   Unmapped vendors keep Sunshine's encoder autodetection. #}
{% set encoder_by_vendor = {"nvidia": "nvenc", "amd": "vaapi", "intel": "vaapi"} -%}
{% set niri_bin_prefix = "" -%}
{% if session == "niri" and vars.niri is defined and vars.niri.bin -%}
{% set niri_bin_prefix -%}NIRI_BIN='{{ vars.niri.bin }}' {% endset -%}
{% endif -%}
adapter_name = /dev/dri/by-path/pci-{{ vars.render_gpu.pci }}-render
address_family = both
capture = {{ capture_backend }}
{% if headless_capture -%}
output_name = sunshine
{% endif -%}
csrf_allowed_origins = https://sunshine.service.xianzzz.com
ds5_inputtino_randomize_mac = disabled
{% if vars.render_gpu.vendor in encoder_by_vendor -%}
encoder = {{ encoder_by_vendor[vars.render_gpu.vendor] }}
{% endif -%}
{% if session == "gnome" -%}
global_prep_cmd = [{"do":"true","undo":"true"}]
{% else -%}
global_prep_cmd = [{"do":"sh -c \"{{ niri_bin_prefix }}python3 ${XDG_CONFIG_HOME:-$HOME/.config}/sunshine/sunshine-prep-{{ session }}.py do --width ${SUNSHINE_CLIENT_WIDTH} --height ${SUNSHINE_CLIENT_HEIGHT} --fps ${SUNSHINE_CLIENT_FPS}{% if prep_args %} {{ prep_args }}{% endif %}\"","undo":"sh -c \"{{ niri_bin_prefix }}python3 ${XDG_CONFIG_HOME:-$HOME/.config}/sunshine/sunshine-prep-{{ session }}.py undo{% if undo_args %} {{ undo_args }}{% endif %}\""}]
{% endif -%}
lan_encryption_mode = 1
stream_audio = true
sw_preset = veryfast
system_tray = disabled
