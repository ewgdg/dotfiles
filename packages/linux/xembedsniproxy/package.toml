id = "linux/xembedsniproxy"
description = "XEmbed-to-SNI tray bridge for Wayland (Wine/Proton and legacy X11 tray icons)"

[targets.wine_sni_bridge_installed]
sync_policy = "push-only"
probe = '{{ PROBE_PACKAGES_INSTALLED }} python-xlib python-dbus python-gobject'

[targets.wine_sni_bridge_installed.hooks]
pre_push = "{{ INSTALL }} python-xlib python-dbus python-gobject"

[targets.f_local_bin_wine_sni_bridge]
source = "files/local/bin/wine-sni-bridge.py"
path = "~/.local/bin/wine-sni-bridge.py"
chmod = "755"

[targets.f_config_systemd_user_xembedsniproxy_service]
source = "files/config/systemd/user/xembedsniproxy.service"
path = "~/.config/systemd/user/xembedsniproxy.service"

[hooks]
post_push = [
  'sh -c "systemctl --user daemon-reload >/dev/null 2>&1 || true"',
  '{{ ENSURE_SYSTEMD }} user xembedsniproxy.service',
]
