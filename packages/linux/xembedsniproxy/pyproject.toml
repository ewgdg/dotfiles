[project]
name = "xembed-sni-proxy"
version = "0.1.0"
description = "XEmbed system tray to StatusNotifierItem proxy for Wayland"
requires-python = ">=3.10"
dependencies = [
  "python-xlib",
  "dbus-python",
  "PyGObject",
]

[project.scripts]
xembed-sni-proxy = "xembed_sni_proxy.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xembed_sni_proxy"]
