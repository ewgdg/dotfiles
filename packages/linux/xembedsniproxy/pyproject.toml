[project]
name = "wine-sni-bridge"
version = "0.1.0"
description = "X11 System Tray to StatusNotifierItem bridge for Wayland"
requires-python = ">=3.10"
dependencies = [
  "python-xlib",
  "dbus-python",
  "PyGObject",
]

[project.scripts]
wine-sni-bridge = "wine_sni_bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["wine_sni_bridge.py"]
