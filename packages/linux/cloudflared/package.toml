id = "linux/cloudflared"
description = "Cloudflare Tunnel client"

# Install only. A tunnel is a concrete thing — which hostname it publishes and which
# local service sits behind it — so its unit and ingress config belong to the package
# that owns the published service. A second tunnel adds its own package depending on
# this one rather than being threaded through variables here.
[targets.cloudflared_installed]
sync_policy = "push-only"
probe = "{{ PROBE_PACKAGES_INSTALLED }} cloudflared"

[targets.cloudflared_installed.hooks]
pre_push = "{{ INSTALL }} cloudflared"
