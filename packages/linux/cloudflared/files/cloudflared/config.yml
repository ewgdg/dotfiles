# Ingress only. The tunnel itself is selected by name on the unit's command line,
# so no tunnel UUID is tracked: cloudflared resolves the name and reads its own
# credentials from ~/.cloudflared.
#
# hostname and local_service come from [vars.cloudflared] in the host profile. This
# package is generic; the host decides what it publishes. For a service that
# advertises a public origin of its own, hostname has to match that origin, or
# clients reach the tunnel and then fail to authenticate.
#
# The catch-all rule is mandatory in any ingress list.
ingress:
  - hostname: {{ vars.cloudflared.hostname }}
    service: {{ vars.cloudflared.local_service }}
  - service: http_status:404
