id = "linux/devspace"
description = "Systemd service for the DevSpace MCP server"

depends = [
  "devspace",
  # The service runs on the system node and the shared global npm prefix, so node
  # installation and the ABI rebuild are planned before the unit is enabled.
  "nodejs",
  # The public connector is part of bringing this service up on this host. The edge
  # sits here rather than on packages/devspace, which is shared with hosts that have
  # no tunnel.
  "linux/cloudflared",
]

[targets.f_config_systemd_user_devspace_service]
source = "files/config/systemd/user/devspace.service"
path = "~/.config/systemd/user/devspace.service"
chmod = "644"

[hooks]
post_push = [
  '{{ ENSURE_SYSTEMD }} user devspace.service',
]
