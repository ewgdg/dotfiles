id = "linux/faugus-launcher"
description = "Install and config for Faugus Launcher"

depends = [
  "linux/xembedsniproxy",
]

[vars.faugus_launcher]
# Runtime state and the SteamGridDB credential stay live-local.
config_selectors = ["donate-last", "playtime", "steamgriddb-api-key"]

[targets.f_config_faugus_launcher_config_json]
source = "files/config/faugus-launcher/config.json"
path = "~/.config/faugus-launcher/config.json"
render = '{{ JSON_RENDER }} --selector-type retain --selectors {{ vars.faugus_launcher.config_selectors|shell_args }} | dotman rewrite home expand -'
capture = '{{ JSON_CAPTURE }} --selector-type remove --selectors {{ vars.faugus_launcher.config_selectors|shell_args }} | dotman rewrite home collapse -'

[targets.f_config_faugus_launcher_envar_json]
source = "files/config/faugus-launcher/envar.json"
path = "~/.config/faugus-launcher/envar.json"

[hooks]
pre_push = [
  "{{ INSTALL }} faugus-launcher",
]
