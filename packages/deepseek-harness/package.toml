id = "deepseek-harness"
description = "On-demand DeepSeek Harness Web UI configuration"

depends = [
  "nodejs",
  "agents",
]

[targets.dsh_install]
sync_policy = "push-only"
probe = 'if command -v dsh >/dev/null 2>&1; then exit 100; fi; exit 0'

[targets.dsh_install.hooks]
pre_push = "{{ NPM_INSTALL }} --foreground-scripts @deepseek-ai/dsh"

[targets.dsh_tui_install]
sync_policy = "push-only"
probe = 'if command -v dsh-tui >/dev/null 2>&1; then exit 100; fi; exit 0'

[targets.dsh_tui_install.hooks]
# The global package is only a dependency-free launcher; the plugin itself runs from the dsh-tui profile.
# Its peer ranges trail DSH release candidates, so skip global peer installation as upstream's reinstall guidance does.
pre_push = "{{ NPM_INSTALL }} --legacy-peer-deps @deepseek-harness-tui/dsh-tui"

[targets.dsh_global_instructions]
sync_policy = "push-only"
probe = 'sh "$DOTMAN_REPO_ROOT/scripts/manage_relative_symlink.sh" probe "~/.dsh/AGENTS.md" "~/.agents/AGENTS.md"'

[targets.dsh_global_instructions.hooks]
pre_push = 'sh "$DOTMAN_REPO_ROOT/scripts/manage_relative_symlink.sh" apply "~/.dsh/AGENTS.md" "~/.agents/AGENTS.md"'

# DSH 0.2 applies the home patch over every profile, so the Web UI and dsh-TUI share tracked providers
# while each profile's own cordis.patch.yml keeps live-local choices such as the default model.
[targets.f_dsh_home_patch]
source = "files/dsh/cordis.patch.yml"
path = "~/.dsh/cordis.patch.yml"
