llm-pi-ai:
  providers:
    openai:
      displayName: Codex LB
      apiKeyEnv: CODEX_LB_API_KEY
      api: openai-responses
      baseURL: https://codexlb.service.xianzzz.com/v1
      models:
      - id: gpt-5.6-sol
        name: GPT-5.6 Sol
        contextWindow: 272000
        maxTokens: 128000
        reasoningEfforts:
          'off': none
          low: low
          medium: medium
          high: high
          xhigh: xhigh
          max: max
      - id: gpt-5.6-terra
        name: GPT-5.6 Terra
        contextWindow: 272000
        maxTokens: 128000
        reasoningEfforts:
          'off': none
          low: low
          medium: medium
          high: high
          xhigh: xhigh
          max: max
      - id: gpt-5.6-luna
        name: GPT-5.6 Luna
        contextWindow: 272000
        maxTokens: 128000
        reasoningEfforts:
          'off': none
          low: low
          medium: medium
          high: high
          xhigh: xhigh
          max: max
    # No models list: the installed pi-ai catalog supplies every model with its own wire protocol,
    # which one hand-declared route could not do because OpenCode Go mixes three protocols.
    opencode-go:
      displayName: OpenCode Go
      apiKeyEnv: OPENCODE_API_KEY
ui-theme:
  preference: dark
