id = "browser"
description = "Chromium/Electron launch flags and Chrome web-app launchers"

[targets.f_config_chrome_flags_conf]
source = "files/config/chrome-flags.conf"
path = "~/.config/chrome-flags.conf"

[targets.f_config_chromium_flags_conf]
source = "files/config/chromium-flags.conf"
path = "~/.config/chromium-flags.conf"

[targets.f_config_electron_flags_conf]
source = "files/config/electron-flags.conf"
path = "~/.config/electron-flags.conf"

[targets.web_apps_installed]
sync_policy = "push-only"
probe = '{{ UV_RUN }} "$DOTMAN_PACKAGE_ROOT/scripts/web_apps.py" probe "$DOTMAN_PACKAGE_ROOT/web-apps.toml"'

[targets.web_apps_installed.hooks]
pre_push = '{{ UV_RUN }} "$DOTMAN_PACKAGE_ROOT/scripts/web_apps.py" apply "$DOTMAN_PACKAGE_ROOT/web-apps.toml"'
