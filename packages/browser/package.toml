id = "browser"
description = "Chromium/Electron launch flags and Chrome web-app launchers"

[targets.f_config_chrome_flags_conf]
source = "files/config/chrome-flags.conf"
path = "~/.config/chrome-flags.conf"

[targets.f_config_chromium_flags_conf]
source = "files/config/chromium-flags.conf"
path = "~/.config/chromium-flags.conf"

[targets.f_config_electron_flags_conf]
source = "files/config/electron-flags.conf"
path = "~/.config/electron-flags.conf"

# Web-app launchers generated by scripts/web_apps.py. These directories are
# shared with other apps, so the ignore patterns hand dotman only `webapp-*`;
# a launcher deleted from the repo is removed live on push.
[targets.d_local_share_applications_webapps]
source = "files/local/share/applications"
path = "~/.local/share/applications"

[targets.d_local_share_applications_webapps.ignore]
patterns = ["*", "!webapp-*.desktop"]

[targets.d_local_share_icons_webapps]
source = "files/local/share/icons/hicolor/256x256/apps"
path = "~/.local/share/icons/hicolor/256x256/apps"

[targets.d_local_share_icons_webapps.ignore]
patterns = ["*", "!webapp-*.png"]

# Other installers left an icon-theme.cache in this directory. GTK judges it
# fresh by the theme root's mtime, which adding a file to a size directory
# leaves unchanged, so new icons stay hidden until the cache is rebuilt. `-t`
# because the user hicolor has no index.theme.
[targets.d_local_share_icons_webapps.hooks]
post_push = 'gtk-update-icon-cache -q -t -f "$HOME/.local/share/icons/hicolor"'
