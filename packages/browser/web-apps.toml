# Chrome `--app` launchers installed by scripts/web_apps.py.
# Convention: `name` is the app's own name plus " Web", e.g. "Gemini Web",
# so launchers stand apart from native apps.
# Each app needs a committed icon at icons/<id>.svg or icons/<id>.png; install
# is offline. `scripts/web_apps.py fetch web-apps.toml <id>` downloads it from
# the site's web app manifest; add it by hand when the site blocks scripts.

[[apps]]
id = "chatgpt"
name = "ChatGPT Web"
url = "https://chatgpt.com/"
# Icon added by hand: chatgpt.com blocks scripted fetches.

[[apps]]
id = "gemini"
name = "Gemini Web"
url = "https://gemini.google.com/"

[[apps]]
id = "memos"
name = "Memos Web"
url = "https://memos.service.xianzzz.com/"

[[apps]]
id = "claude"
name = "Claude Web"
url = "https://claude.ai/"
# Icon added by hand: claude.ai blocks scripted fetches.

[[apps]]
id = "youtube-music"
name = "YouTube Music Web"
url = "https://music.youtube.com/"
