# Chrome `--app` launchers installed by scripts/web_apps.py.
# Convention: `name` is the app's own name plus " Web", e.g. "Gemini Web",
# so launchers stand apart from native apps.
# Icons come from the site's web app manifest. Set `icon` to a direct image
# URL (SVG or raster) only when the manifest can't be fetched or lacks one.

[[apps]]
id = "chatgpt"
name = "ChatGPT Web"
url = "https://chatgpt.com/"
# chatgpt.com blocks non-browser page fetches, so its manifest is unreachable.
icon = "https://chatgpt.com/cdn/assets/favicon-l4nq08hd.svg"

[[apps]]
id = "gemini"
name = "Gemini Web"
url = "https://gemini.google.com/"

[[apps]]
id = "memos"
name = "Memos Web"
url = "https://memos.service.xianzzz.com/"

[[apps]]
id = "claude"
name = "Claude Web"
url = "https://claude.ai/"
# claude.ai blocks non-browser page fetches, so its manifest is unreachable.
icon = "https://claude.ai/favicon.svg"
