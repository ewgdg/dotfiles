id = "shell"
description = "Shell and prompt workflow configuration"

[targets.d_config_zsh]
source = "files/config/zsh"
path = "~/.config/zsh"
chmod = "700"

[targets.d_config_oh_my_posh]
source = "files/config/oh-my-posh"
path = "~/.config/oh-my-posh"

[targets.d_config_tmux]
source = "files/config/tmux"
path = "~/.config/tmux"

[targets.d_config_tmux.ignore]
shared = [
  "plugins/",
]

[targets.d_config_fd]
source = "files/config/fd"
path = "~/.config/fd"

[targets.f_config_sh_env_core]
source = "files/env.core.sh"
path = "~/.config/shell/env.core.sh"
chmod = "644"
render = 'sh "$DOTMAN_PACKAGE_ROOT/scripts/core_env_token.sh" render "$DOTMAN_REPO_PATH"'
capture = 'sh "$DOTMAN_PACKAGE_ROOT/scripts/core_env_token.sh" capture "$DOTMAN_LIVE_PATH"'

[targets.f_profile]
source = "files/profile"
path = "~/.profile"
preset = "jinja-patch-editor"

[targets.f_zprofile]
source = "files/zprofile"
path = "~/.zprofile"

[targets.f_zshenv]
source = "files/zshenv"
path = "~/.zshenv"

[targets.f_zshrc]
source = "files/zshrc"
path = "~/.zshrc"

[targets.shell_cli_tools_installed]
sync_policy = "push-only"
probe = "{{ PROBE_PACKAGES_INSTALLED }} fzf bat fd eza zoxide ripgrep"

[targets.shell_cli_tools_installed.hooks]
pre_push = "{{ INSTALL }} fzf bat fd eza zoxide ripgrep"

[targets.terminal_workflow_tools_installed]
sync_policy = "push-only"
probe = "{{ PROBE_PACKAGES_INSTALLED }} tmux oh-my-posh"

[targets.terminal_workflow_tools_installed.hooks]
pre_push = "{{ INSTALL }} tmux oh-my-posh"

[targets.file_management_tools_installed]
sync_policy = "push-only"
probe = "{{ PROBE_PACKAGES_INSTALLED }} rsync trash-cli yazi chafa"

[targets.file_management_tools_installed.hooks]
pre_push = "{{ INSTALL }} rsync trash-cli yazi chafa"
