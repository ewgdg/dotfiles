  "settings.terminalActivePaneOpacity",
  "settings.terminalInactivePaneOpacity",
  "settings.terminalPaneOpacityTransitionMs",
  "settings.terminalBackgroundOpacity",
  "settings.terminalMinimumContrastRatio",
  "settings.terminalPaddingX",
  "settings.terminalPaddingY",
  "settings.terminalScrollbackRows",
  "settings.terminalScrollSensitivity",
  "settings.terminalFastScrollSensitivity",
  "settings.terminalTuiScrollSensitivity",
  "settings.terminalMouseHideWhileTyping",
  "settings.terminalFocusFollowsMouse",
  "settings.terminalClipboardOnSelect",
  "settings.terminalCopyTrimsGutter",
  "settings.terminalRightClickToPaste",
