id = "orca"
description = "Orca desktop app for running coding agents in parallel worktrees"

[vars.orca]
# The first profile Orca creates; other profiles get generated IDs.
data_file = '{% if os == "darwin" %}~/Library/Application Support{% else %}~/.config{% endif %}/Orca/profiles/local-default/orca-data.json'
# orca-data.json is the whole app state, so it syncs by allowlist: capture keeps
# only these paths and render replaces only these paths in the live file.
# Everything else (repos, worktrees, sessions, accounts, secrets, machine
# values, migration flags, panel widths) stays live-local. Add new upstream
# settings here when they are worth syncing.
synced_selectors = [
  # settings: Appearance.
  "settings.theme",
  "settings.uiLanguage",
  "settings.appIcon",
  "settings.appFontFamily",
  "settings.leftSidebarAppearanceMode",
  "settings.leftSidebarTintColor",
  "settings.leftSidebarTintOpacity",
  "settings.windowBackgroundBlur",
  "settings.showTitlebarAppName",
  # settings: Keyboard.
  "settings.keybindings",
  "settings.ctrlTabOrderMode",
  "settings.terminalShortcutPolicy",
  "settings.terminalMacOptionAsAlt",
  # settings: Editor and diff.
  "settings.editorFontFamily",
  "settings.editorAutoSave",
  "settings.editorAutoSaveDelayMs",
  "settings.editorMinimapEnabled",
  "settings.editorWordWrap",
  "settings.editorPreviewTabsEnabled",
  "settings.richMarkdownSpellcheckEnabled",
  "settings.markdownReviewToolsEnabled",
  "settings.diffDefaultView",
  "settings.diffWordWrap",
  "settings.diffShowWhitespace",
  "settings.diffCollapseUnchangedRegions",
  "settings.combinedDiffFileTreeVisibleByDefault",
  # settings: Terminal.
  "settings.terminalFontSize",
  "settings.terminalFontFamily",
  "settings.terminalFontWeight",
  "settings.terminalFontWeightBold",
  "settings.terminalLineHeight",
  "settings.terminalLigatures",
  "settings.terminalGpuAcceleration",
